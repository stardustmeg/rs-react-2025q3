name: Run Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    name: Run Vitest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Run Vitest tests
        run: npm run test

      - name: Generate coverage report
        run: npm run test:coverage
